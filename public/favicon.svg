<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512" fill="none">
  <!-- Same geometry as app/components/BrandMark.tsx v3: three isometric slabs, glowing scan slice pulled out. -->
  <defs>
    <linearGradient id="fav-slab-top" x1="116" y1="80" x2="396" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fav-slab-left" x1="116" y1="150" x2="116" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="fav-slab-right" x1="396" y1="150" x2="396" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="fav-scan-top" x1="158" y1="252" x2="438" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fav-scan-face" x1="158" y1="252" x2="298" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="fav-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05080c"/>
  <g transform="translate(-20, -17) scale(1.08)">
    <polygon points="256,280 396,350 256,420 116,350" fill="url(#fav-slab-top)"/>
    <polygon points="116,350 256,420 256,466 116,396" fill="url(#fav-slab-left)"/>
    <polygon points="396,350 256,420 256,466 396,396" fill="url(#fav-slab-right)"/>
    <g filter="url(#fav-glow)">
      <polygon points="298,182 438,252 298,322 158,252" fill="url(#fav-scan-top)"/>
      <polygon points="158,252 298,322 298,356 158,286" fill="url(#fav-scan-face)"/>
      <polygon points="438,252 298,322 298,356 438,286" fill="#6366f1"/>
    </g>
    <polygon points="256,80 396,150 256,220 116,150" fill="url(#fav-slab-top)"/>
    <polygon points="116,150 256,220 256,266 116,196" fill="url(#fav-slab-left)"/>
    <polygon points="396,150 256,220 256,266 396,196" fill="url(#fav-slab-right)"/>
  </g>
</svg>
